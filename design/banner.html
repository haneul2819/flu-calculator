<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.canvas { width: 170px; height: 220px; background: linear-gradient(160deg, #0f766e 0%, #0b4f4a 100%); color: #fff; padding: 16px 14px; }
.bubble { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.07); right: -60px; top: -50px; }
.eyebrow { font-size: 11px; font-weight: 700; color: var(--mint); }
h1 { margin-top: 6px; font-size: 23px; line-height: 1.18; font-weight: 900; letter-spacing: -0.04em; }
.sub { margin-top: 8px; font-size: 11.5px; line-height: 1.45; color: rgba(255,255,255,.88); }
.btn { position: absolute; left: 14px; right: 14px; bottom: 14px; background: #fff; color: var(--teal); border-radius: 999px; text-align: center; font-size: 13.5px; font-weight: 900; padding: 7px 0; }
</style></head>
<body><div class="canvas">
  <div class="bubble"></div>
  <p class="eyebrow">2026-2027절기</p>
  <h1>독감<br>무료접종일<br>계산기</h1>
  <p class="sub">생년월일만 넣으면<br>접종일을 알려드려요</p>
  <p class="btn">계산하기 →</p>
</div></body></html>
