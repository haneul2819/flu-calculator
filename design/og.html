<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.canvas { width: 1200px; height: 630px; background: linear-gradient(135deg, #0f766e 0%, #0b4f4a 100%); color: #fff; padding: 64px 72px; }
.bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.06); }
.b1 { width: 520px; height: 520px; right: -120px; top: -160px; }
.b2 { width: 300px; height: 300px; right: 300px; bottom: -190px; }
.eyebrow { font-size: 26px; font-weight: 700; color: var(--mint); letter-spacing: -0.01em; }
h1 { margin-top: 14px; font-size: 84px; line-height: 1.12; font-weight: 900; letter-spacing: -0.035em; }
.sub { margin-top: 22px; font-size: 29px; font-weight: 500; line-height: 1.45; color: rgba(255,255,255,.9); }
.chips { position: absolute; left: 72px; bottom: 60px; display: flex; gap: 10px; }
.chip { font-size: 22px; font-weight: 700; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.28); }
.url { position: absolute; right: 72px; bottom: 66px; font-size: 24px; font-weight: 700; color: var(--mint); }
.phone { position: absolute; right: 72px; top: 92px; width: 360px; background: #fff; color: var(--ink); border-radius: 28px; padding: 28px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
.lbl { font-size: 18px; font-weight: 700; color: var(--ink-2); }
.input { margin-top: 10px; border: 2.5px solid var(--teal); border-radius: 14px; padding: 12px 16px; font-size: 34px; font-weight: 900; letter-spacing: .06em; }
.who { margin-top: 10px; font-size: 17px; font-weight: 700; color: var(--teal); }
.arrow { margin: 14px auto 12px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 16px solid var(--teal); }
.res { background: var(--teal); color: #fff; border-radius: 16px; padding: 16px 18px; }
.res .k { font-size: 16px; font-weight: 700; opacity: .85; }
.res .v { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.25; }
.res .s { font-size: 16px; opacity: .9; }
</style></head>
<body><div class="canvas">
  <div class="bubble b1"></div><div class="bubble b2"></div>
  <p class="eyebrow">2026-2027절기 인플루엔자 예방접종</p>
  <h1>독감 무료접종일<br>계산기</h1>
  <p class="sub">생년월일만 넣으면<br>내 무료 접종 시작일을 바로 알려드려요</p>
  <div class="chips"><span class="chip">어린이</span><span class="chip">임신부</span><span class="chip">어르신</span><span class="chip">의료취약계층</span><span class="chip">중·고등학생</span></div>
  <div class="phone">
    <p class="lbl">생년월일 8자리</p>
    <p class="input">19550315</p>
    <p class="who">1955년 3월 15일생 · 어르신 70~74세</p>
    <div class="arrow"></div>
    <div class="res"><p class="k">무료 접종 가능일</p><p class="v">10. 12.(월)부터</p><p class="s">전국 지정위탁의료기관 · 신분증</p></div>
  </div>
  <p class="url">flu.hnlab.kr</p>
</div></body></html>
